<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Portfolio | Full-Stack Lab 03</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header-footer.css">
</head>
<body>

  <!-- MEMBER 4: HEADER goes here -->

  <main>
    <div id="team-box">
      <h2>Our Team</h2>
    </div>
    <form method="" >
      <label>Name</label><br>
      <input type="text" name="name" placeholder="Your Name"><br>
      <label>Email</label><br>
      <input type="text" name="email" placeholder="you@example.com"><br>
      <label>Message</label><br>
      <textarea  name="msg" rows="5" cols="30" placeholder="Write Your Message"></textarea><br>
      <input type="submit" value="Send Message" id="msg-send-btn">
    </form>
  </main>

  <!-- MEMBER 4: FOOTER goes here -->

  <script src="js/script.js"></script>
</body>
</html>
